<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parking YOLO Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #f6f7fb; color: #111827; }
    .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    input, button { padding: 10px; margin: 6px 0; }
    button { cursor: pointer; border: 0; border-radius: 10px; background: #111827; color: white; }
    pre { background: #111827; color: #e5e7eb; padding: 14px; border-radius: 12px; overflow-x: auto; }
    img { max-width: 100%; border-radius: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Parking YOLO Dashboard</h1>
  <div class="card">
    <h2>Проверка изображения</h2>
    <p>camera_id по умолчанию: <b>parking_1</b></p>
    <input id="cameraId" value="parking_1" />
    <br />
    <input id="file" type="file" accept="image/*" />
    <br />
    <label><input id="force" type="checkbox" checked /> force=true, чтобы сразу менять статус без ожидания 5 секунд</label>
    <br />
    <button onclick="sendImage()">Отправить изображение</button>
  </div>

  <div class="card">
    <h2>Результат</h2>
    <pre id="result">Пока нет данных</pre>
    <img id="vis" style="display:none" />
  </div>

  <script>
    async function sendImage() {
      const file = document.getElementById('file').files[0];
      const cameraId = document.getElementById('cameraId').value;
      const force = document.getElementById('force').checked;
      if (!file) { alert('Выбери изображение'); return; }
      const form = new FormData();
      form.append('camera_id', cameraId);
      form.append('force', force);
      form.append('file', file);
      const res = await fetch('/api/detect/image', { method: 'POST', body: form });
      const data = await res.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      if (data.visualization_url) {
        const img = document.getElementById('vis');
        img.src = data.visualization_url + '?t=' + Date.now();
        img.style.display = 'block';
      }
    }
  </script>
</body>
</html>
