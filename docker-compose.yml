services:
  postgres:
    image: postgres:16
    container_name: parking-postgres
    environment:
      POSTGRES_DB: parking_db
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: parking_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking_user -d parking_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  parking-backend:
    build: .
    container_name: parking-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://parking_user:parking_password@postgres:5432/parking_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./models:/app/models

volumes:
  postgres_data:
